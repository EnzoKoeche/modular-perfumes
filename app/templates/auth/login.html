{% extends 'base.html' %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
      <h1 class="h3 mb-3">Entrar</h1>
      {% if erro %}<div class="alert alert-danger py-2">{{ erro }}</div>{% endif %}
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input id="email" name="email" type="email" class="form-control" value="{{ email }}" required autocomplete="email" autofocus>
        </div>
        <div class="mb-3">
          <label for="senha" class="form-label">Senha</label>
          <input id="senha" name="senha" type="password" class="form-control" required autocomplete="current-password">
        </div>
        <button class="btn mp-btn w-100">Entrar</button>
      </form>
      <p class="small text-center mt-3 mb-0">Ainda não tem conta? <a href="{{ url_for('auth.cadastro') }}">Criar conta</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
