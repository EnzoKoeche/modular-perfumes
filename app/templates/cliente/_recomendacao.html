<div class="card card-hover">
  <a class="card-body d-flex gap-3 text-decoration-none text-reset" href="{{ url_for('vitrine.detalhe', perfume_id=r.perfume_id) }}">
    {% if r.imagem_url %}<img data-foto class="frasco" src="{{ r.imagem_url }}" alt="">{% else %}<div class="frasco foto-vazia"><i class="bi bi-droplet-half"></i></div>{% endif %}
    <div>
      <div class="fw-semibold">{{ r.nome }}</div>
      <div class="small text-muted">{{ r.marca }}{% if r.ano %} · {{ r.ano }}{% endif %}</div>
      <div class="small mt-1">{{ r.justificativa }}</div>
    </div>
  </a>
  <form class="px-3 pb-3" method="post" action="{{ url_for('sacola.adicionar', perfume_id=r.perfume_id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button class="btn btn-sm mp-btn"><i class="bi bi-bag-plus"></i> Adicionar à sacola</button>
  </form>
</div>
