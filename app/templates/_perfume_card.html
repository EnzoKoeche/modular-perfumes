{# cartão de perfume reutilizável: recebe `p` #}
<a class="card card-hover h-100 text-decoration-none text-reset" href="{{ url_for('vitrine.detalhe', perfume_id=p.id) }}">
  <div class="card-body p-3">
    {% if p.imagem_url %}<img data-foto class="foto mb-3" src="{{ p.imagem_url }}" alt="Frasco de {{ p.nome }}" loading="lazy">
    {% else %}<div class="foto-vazia mb-3"><i class="bi bi-droplet-half"></i></div>{% endif %}
    <div class="d-flex justify-content-between align-items-start gap-2">
      <div>
        <div class="fw-semibold lh-sm">{{ p.nome }}</div>
        <div class="small text-muted">{{ p.marca }}{% if p.ano %} · {{ p.ano }}{% endif %}</div>
      </div>
      {% if p.avaliacao %}<span class="nota text-nowrap"><i class="bi bi-star-fill" style="color:#f5b301"></i> {{ '%.2f'|format(p.avaliacao) }}</span>{% endif %}
    </div>
    {% if p.acordes %}<div class="small text-muted mt-2 text-truncate mono">{{ p.acordes }}</div>{% endif %}
  </div>
</a>
