# Banco MySQL para desenvolvimento local.
# Na primeira subida, o MySQL roda os scripts da 1ª e da 2ª Sprint e cria as tabelas com a carga inicial.
services:
  db:
    image: mysql:8.4
    container_name: modular-perfumes-db
    environment:
      TZ: America/Sao_Paulo   # NOW() e CURRENT_TIMESTAMP no horário de Brasília
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-modular_perfumes}
      MYSQL_USER: ${MYSQL_USER:-modular}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-modular_dev}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - dados_mysql:/var/lib/mysql
      - ./entregas/sql/modular_perfumes_sprint1.sql:/docker-entrypoint-initdb.d/01_sprint1.sql:ro
      - ./entregas/sql/modular_perfumes_sprint2.sql:/docker-entrypoint-initdb.d/02_sprint2.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_dev}"]
      interval: 5s
      retries: 20

volumes:
  dados_mysql:
